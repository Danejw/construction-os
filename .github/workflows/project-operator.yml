name: Project Operator CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'api/routers/project_operator.py'
      - 'api/routers/__init__.py'
      - 'construction_os/project_operator/**'
      - 'tests/test_project_operator*.py'
      - '.github/workflows/project-operator.yml'
  push:
    branches:
      - dev
      - main
      - 'feature/project-operator-*'
    paths:
      - 'api/routers/project_operator.py'
      - 'api/routers/__init__.py'
      - 'construction_os/project_operator/**'
      - 'tests/test_project_operator*.py'
      - '.github/workflows/project-operator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Project Operator backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check Project Operator lint
        run: |
          python -m ruff check \
            api/routers/project_operator.py \
            construction_os/project_operator \
            tests/test_project_operator*.py

      - name: Compile Project Operator modules
        run: |
          python -m compileall -q \
            api/routers/project_operator.py \
            construction_os/project_operator

      - name: Run Project Operator tests
        env:
          CONSTRUCTION_OS_PASSWORD: ''
        run: python -m pytest -q tests/test_project_operator*.py
